<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>fdj-def=r+w4</title>
<meta name="description" content="刘怡佳生日快乐，愿你的每一天都被温柔以待">
<meta property="og:title" content="fdj-def=r+w4">
<meta property="og:description" content="刘怡佳生日快乐，愿你的每一天都被温柔以待">
<meta property="og:image" content="https://lycheer-m.github.io/heart-blessing/cover.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lycheer-m.github.io/heart-blessing/">
<style>
  :root {
    --pink: #e9405f;
    --pink-deep: #d92b4b;
    --ink: #7a1f33;
    --card-w: 120px;
    --card-h: 50px;
    --font-s: 15px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "微软雅黑",
                 "Hiragino Sans GB", "Segoe UI", sans-serif;
  }
  body {
    background: #e6d7b8 url('aa.jpg') no-repeat center / cover;
  }

  #center-msg {
    position: fixed;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: var(--ink);
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.2s ease;
    z-index: 1;
  }
  #center-msg.show { opacity: 1; }
  #center-msg .big {
    font-size: clamp(18px, 3.4vw, 34px);
    font-weight: 700;
    letter-spacing: 1px;
  }
  #center-msg .sub {
    margin-top: 6px;
    font-size: clamp(12px, 1.8vw, 16px);
    opacity: 0.85;
  }

  /* 祝福弹窗卡片 */
  .card {
    position: fixed;
    left: 0; top: 0;
    min-width: var(--card-w);
    max-width: 110px;
    min-height: var(--card-h);
    padding: 4px 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: #fff;
    color: var(--pink-deep);
    font-size: var(--font-s);
    font-weight: 700;
    line-height: 1.35;
    text-align: center;
    border-radius: 10px;
    border: 1px solid rgba(233, 64, 95, 0.18);
    box-shadow: 0 6px 18px rgba(217, 43, 75, 0.22);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    /* 出现/消失动画都走这里 */
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.4);
    transition: transform .38s cubic-bezier(.34,1.56,.64,1),
                opacity .38s ease;
    z-index: 2;
  }
  .card.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  .card.hide {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.7);
  }
  .card.fade-out {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.6);
    transition: opacity 1.4s ease, transform 1.4s ease;
  }

  /* 音乐按钮 */
  #music-toggle {
    position: fixed;
    top: 20px; right: 20px;
    width: 48px; height: 48px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.92);
    color: var(--pink-deep);
    font-size: 22px;
    line-height: 1;
    box-shadow: 0 4px 14px rgba(217, 43, 75, 0.28);
    cursor: pointer;
    z-index: 10000;
  }
  #music-toggle:active { transform: scale(0.9); }

  /* 入口界面（来电整蛊风） */
  #entry {
    position: fixed;
    left: 0; top: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
    background: linear-gradient(180deg, #10101c 0%, #1a1a2e 55%, #23233a 100%);
    z-index: 20000;
    transition: opacity .5s ease;
    box-sizing: border-box;
  }
  #entry.hide { opacity: 0; pointer-events: none; }
  /* 登录框 */
  .login-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 320px;
    gap: 14px;
  }
  .login-avatar {
    width: 120px; height: 120px;
    border-radius: 16px;
    background: url('tou.jpg') no-repeat center / cover;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
  }
  .login-title {
    color: #fff;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 3px;
  }
  .login-sub {
    color: #9aa0b5;
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .login-input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.06);
    color: #fff;
    font-size: 18px;
    text-align: center;
    letter-spacing: 4px;
    outline: none;
    box-sizing: border-box;
  }
  .login-input::placeholder { color: #6a7089; letter-spacing: 1px; }
  .login-input:focus { border-color: #e9405f; }
  .login-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #e9405f;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 6px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(233, 64, 95, 0.35);
  }
  .login-btn:active { transform: scale(0.97); }
  .login-error {
    color: #ff6b6b;
    font-size: 14px;
    min-height: 20px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div id="entry">
  <div class="login-box">
    <div class="login-avatar"></div>
    <div class="login-title">迪迦系统已锁定</div>
    <div class="login-sub">请输入密码解锁</div>
    <input type="password" id="pwd-input" class="login-input" placeholder="请输入密码" autocomplete="off">
    <button id="btn-login" class="login-btn">🔓 解锁</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="center-msg">
  <div class="big">刘怡佳生日快乐</div>
  <div class="sub">愿你的每一天都被温柔以待</div>
</div>

<audio id="bgm" src="vid_audio.mp3" loop preload="auto"></audio>
<button id="music-toggle" title="播放音乐">🎵</button>

<script>
(function () {
  // ============ 可改参数 ============
  var MESSAGES = [
    "生日快乐，天天开心", "一岁一礼，一寸欢喜", "生日快乐，心想事成", "新的一岁，越来越好",
    "平安喜乐，万事胜意", "年年有今日，岁岁有今朝", "眼里有光，脚下有路", "年龄+1，烦恼清零",
    "生于热爱，长于自由", "每个明天都更好",

    "岁岁欢愉，清澈明朗", "走过山川，初心不改", "岁岁常欢愉，年年皆胜意", "新的一岁，闪闪发光",
    "所有美好，都如期而至"
  ];
  var POP_INTERVAL = 60;   // 每个间隔（毫秒）
  var AUTO_CLOSE = 15000;   // 自动消失（毫秒）—— 已取消，卡片不再自动消失

  // ============ 数字形状（canvas 渲染文字后均匀采样描点） ============
  var SHAPE_TEXT = '20';

  function numberPoints(n) {
    var cw = 260, ch = 200;
    var cv = document.createElement('canvas');
    cv.width = cw; cv.height = ch;
    var ctx = cv.getContext('2d');
    ctx.fillStyle = '#000';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 170px "Arial Black", "Arial", "Microsoft YaHei", sans-serif';
    ctx.fillText(SHAPE_TEXT, cw / 2, ch / 2);

    var d = ctx.getImageData(0, 0, cw, ch).data;
    var pixels = [];
    var minx = cw, miny = ch, maxx = 0, maxy = 0;
    for (var y = 0; y < ch; y++) {
      for (var x = 0; x < cw; x++) {
        if (d[(y * cw + x) * 4 + 3] > 128) {
          pixels.push({ x: x, y: y });
          if (x < minx) minx = x;
          if (x > maxx) maxx = x;
          if (y < miny) miny = y;
          if (y > maxy) maxy = y;
        }
      }
    }
    var pts = [];
    if (pixels.length === 0) return pts;
    var step = pixels.length / n;
    // 归一化到与心形一致的坐标尺度（宽约 32 单位），复用原有缩放/居中逻辑
    var bw = maxx - minx || 1, bh = maxy - miny || 1;
    var sc = 32 / bw;
    var cx = (minx + maxx) / 2, cy = (miny + maxy) / 2;
    for (var i = 0; i < n; i++) {
      var p = pixels[Math.floor(i * step)];
      pts.push({ x: (p.x - cx) * sc, y: (p.y - cy) * sc });
    }
    return pts;
  }

  // ============ 数字整体边界（细采样，供缩放居中用） ============
  var RAW = (function () {
    var pts = numberPoints(720);
    var xs = pts.map(function (p) { return p.x; });
    var ys = pts.map(function (p) { return p.y; });
    return {
      w: Math.max.apply(null, xs) - Math.min.apply(null, xs),
      h: Math.max.apply(null, ys) - Math.min.apply(null, ys),
      cx: (Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2,
      cy: (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2
    };
  })();

  // ============ 响应式参数 ============
  function responsive() {
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var small = vw < 768;
    // 弹窗数量：数字要更细致，点更多；小屏少一点
    var n = small ? 60 : 110;
    // 卡片尺寸与字体随屏幕缩放（整体缩小，更细致）
    var s = Math.min((vw - 90) / RAW.w, (vh - 110) / RAW.h);
    s = Math.max(s, 3.5);
    var cw = Math.min(Math.max(s * 1.5, small ? 30 : 36), 88);
    var ch = Math.min(Math.max(s * 0.7, small ? 18 : 22), 40);
    var fs = Math.min(Math.max(s * 0.26, small ? 9 : 10), 13);
    document.documentElement.style.setProperty('--card-w', cw + 'px');
    document.documentElement.style.setProperty('--card-h', ch + 'px');
    document.documentElement.style.setProperty('--font-s', fs + 'px');
    return { n: n, s: s, vw: vw, vh: vh };
  }

  // ============ 数字坐标 → 屏幕坐标 ============
  function computePositions(n, s, vw, vh) {
    var pts = numberPoints(n);
    var ox = vw / 2, oy = vh / 2;
    return pts.map(function (p) {
      return {
        x: (p.x - RAW.cx) * s + ox,
        y: (p.y - RAW.cy) * s + oy   // canvas 已是屏幕方向（y 向下），无需翻转
      };
    });
  }

  var positions = [];
  var cards = [];        // { el, hideTimer }
  var spawnTimers = [];

  function clearAll() {
    spawnTimers.forEach(clearTimeout);
    spawnTimers = [];
    cards.forEach(function (c) {
      clearTimeout(c.hideTimer);
      if (c.el.parentNode) c.el.parentNode.removeChild(c.el);
    });
    cards = [];
  }

  // 每个文字框一种颜色（循环取色，相邻不重色）
  var PALETTE = [
    '#ffd6dc', '#ffc2c7', '#ffd1b3', '#ffe3b3',
    '#fce1a4', '#d8c7f7', '#c9bdf2', '#b8d4f5',
    '#a8d8ea', '#b7e4c7', '#c4e2c9', '#ffd1dc'
  ];
  var colorIdx = 0;
  var zTop = 0;

  function makeCard(msg, x, y, heartIdx) {
    var el = document.createElement('div');
    el.className = 'card';
    var c = PALETTE[colorIdx % PALETTE.length];
    el.style.background = 'radial-gradient(ellipse at center, ' + c + ' 55%, transparent 100%)';
    el.style.color = '#222';
    el.style.border = 'none';
    el.style.boxShadow = 'none';
    el.style.zIndex = ++zTop;   // 新出来的框盖在旧的上面
    colorIdx++;
    el.innerHTML = '<span>' + msg + '</span>';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);

    // 下一帧再添加 .show，触发过渡动画
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { el.classList.add('show'); });
    });

    cards.push({ el: el, hideTimer: null, heartIdx: heartIdx });

    // 点击关闭（不再自动消失）
    el.addEventListener('click', function () {
      el.classList.add('hide');
      setTimeout(function () {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 400);
    });

    return el;
  }

  function spawnOne(idx, positions, msgs) {
    if (idx >= positions.length) {
      // 数字成形后停顿两秒，再让数字慢慢消失
      var t = setTimeout(fadeOutShape, 2000);
      spawnTimers.push(t);
      return;
    }
    var pos = positions[idx];
    makeCard(msgs[idx], pos.x, pos.y, idx);
    var t = setTimeout(function () {
      spawnOne(idx + 1, positions, msgs);
    }, POP_INTERVAL);
    spawnTimers.push(t);
  }

  // 让组成数字的卡片慢慢消失，然后再铺满屏幕
  function fadeOutShape() {
    cards.forEach(function (c) {
      if (c.heartIdx != null) c.el.classList.add('fade-out');
    });
    var t = setTimeout(function () {
      cards.forEach(function (c) {
        if (c.heartIdx != null && c.el.parentNode) c.el.parentNode.removeChild(c.el);
      });
      cards = cards.filter(function (c) { return c.heartIdx == null; });
      fillScreen();
    }, 1500);
    spawnTimers.push(t);
  }

  // 数字成形后，随机位置弹文字框真正铺满屏幕（不自动消失）
  function fillScreen() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var cs = getComputedStyle(document.documentElement);
    var fs = parseFloat(cs.getPropertyValue('--font-s')) || 15;
    // 卡片已改成自适应尺寸，用字号估算真实大小，避免铺得过密
    var cw = fs * 8 + 26;
    var ch = fs * 1.4 + 14;
    var count = Math.round((vw * vh) / (cw * ch) * 2.0);
    count = Math.max(40, Math.min(count, 320));
    var msgs = [];
    for (var i = 0; i < count; i++) msgs.push(MESSAGES[i % MESSAGES.length]);
    msgs.sort(function () { return Math.random() - 0.5; });
    for (var i = 0; i < count; i++) {
      (function (i) {
        var x = 30 + Math.random() * (vw - 60);
        var y = 30 + Math.random() * (vh - 60);
        var t = setTimeout(function () { makeCard(msgs[i], x, y); }, i * 25);
        spawnTimers.push(t);
      })(i);
    }
  }

  function play() {
    clearAll();
    colorIdx = 0;
    zTop = 0;
    var r = responsive();
    positions = computePositions(r.n, r.s, r.vw, r.vh);

    // 祝福文案循环铺满并打乱
    var msgs = [];
    for (var i = 0; i < r.n; i++) msgs.push(MESSAGES[i % MESSAGES.length]);
    msgs.sort(function () { return Math.random() - 0.5; });

    document.getElementById('center-msg').classList.add('show');

    spawnOne(0, positions, msgs);
  }

  // 窗口尺寸变化时重新布局（防抖）
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var r = responsive();
      positions = computePositions(r.n, r.s, r.vw, r.vh);
      // 只更新还存在的数字卡片位置（铺满屏幕的随机卡片不动）
      cards.forEach(function (c) {
        if (c.heartIdx == null) return;
        var p = positions[c.heartIdx];
        if (p) { c.el.style.left = p.x + 'px'; c.el.style.top = p.y + 'px'; }
      });
    }, 150);
  });

  // 音乐（手机浏览器需用户点一下才能出声）
  var bgm = document.getElementById('bgm');
  var musicBtn = document.getElementById('music-toggle');
  var musicOn = false;

  function startMusic() {
    bgm.play().then(function () {
      musicBtn.textContent = '🔊';
      musicOn = true;
    }).catch(function () {
      musicBtn.textContent = '🎵';
      musicOn = false;
    });
  }

  musicBtn.addEventListener('click', function () {
    if (musicOn) {
      bgm.pause();
      musicBtn.textContent = '🎵';
      musicOn = false;
    } else {
      startMusic();
    }
  });

  // 进入正题：密码正确 → 放音乐 + 开始爱心动画
  var entry = document.getElementById('entry');
  var pwdInput = document.getElementById('pwd-input');
  var loginError = document.getElementById('login-error');
  var PASSWORD = '20260830';

  function enter() {
    entry.classList.add('hide');
    startMusic();
    play();
  }

  function tryLogin() {
    if (pwdInput.value.trim() === PASSWORD) {
      loginError.textContent = '';
      enter();
    } else {
      loginError.textContent = '密码错误，请重新输入';
      pwdInput.value = '';
      pwdInput.focus();
    }
  }

  document.getElementById('btn-login').addEventListener('click', tryLogin);

  pwdInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') tryLogin();
  });
})();
</script>
</body>
</html>
